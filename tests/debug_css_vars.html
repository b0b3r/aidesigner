<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Отладка CSS переменных</title>
</head>
<body>
    <h1>🔍 Отладка CSS переменных</h1>
    
    <div id="test-container">
        <!-- Вставьте сюда ваш HTML код для тестирования -->
        <style>
        :root, *, *::before, *::after {
            /* Primary colors */
            --mdc-theme-primary: #6200ee !important;
            --mdc-theme-on-primary: #ffffff !important;
            --mdc-theme-surface: #ffffff !important;
            --mdc-theme-background: #f5f5f5 !important;
            --mdc-theme-text-primary-on-background: rgba(0, 0, 0, 0.87) !important;
            --mdc-theme-text-secondary-on-background: rgba(0, 0, 0, 0.54) !important;
        }
        </style>
        
        <div class="mdc-card" style="width: 100%; max-width: 360px; border-radius: 12px; overflow: hidden; background-color: var(--mdc-theme-surface); box-shadow: 0px 2px 4px rgba(0,0,0,0.1);">
          <div style="height: 200px; background-color: var(--mdc-theme-background); display: flex; justify-content: center; align-items: center;">
            <span style="font-size: 48px; color: var(--mdc-theme-text-secondary-on-background);">📷</span>
          </div>
          <div style="padding: 16px;">
            <h3 style="margin: 0 0 8px 0; color: var(--mdc-theme-text-primary-on-background); font-size: 1.25rem;">Название товара</h3>
            <p style="margin: 0 0 16px 0; color: var(--mdc-theme-text-secondary-on-background); font-size: 0.875rem;">Краткое описание товара</p>
            <div style="display: flex; justify-content: space-between; align-items: center;">
              <span style="color: var(--mdc-theme-text-primary-on-background); font-weight: 500; font-size: 1.125rem;">1 990 ₽</span>
              <button style="min-width: 100px; height: 36px; border-radius: 18px; background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary); border: none; cursor: pointer;">
                Купить
              </button>
            </div>
          </div>
        </div>
    </div>
    
    <script>
        // Отладочная функция
        function debugCSSVariables() {
            console.log('=== ОТЛАДКА CSS ПЕРЕМЕННЫХ ===');
            
            // Проверяем значения переменных в :root
            const rootStyle = getComputedStyle(document.documentElement);
            console.log('🔍 CSS переменные в :root:');
            console.log('--mdc-theme-primary:', rootStyle.getPropertyValue('--mdc-theme-primary'));
            console.log('--mdc-theme-on-primary:', rootStyle.getPropertyValue('--mdc-theme-on-primary'));
            console.log('--mdc-theme-surface:', rootStyle.getPropertyValue('--mdc-theme-surface'));
            
            // Проверяем кнопку
            const button = document.querySelector('button');
            if (button) {
                const buttonStyle = getComputedStyle(button);
                console.log('🔍 Кнопка:');
                console.log('background-color:', buttonStyle.backgroundColor);
                console.log('color:', buttonStyle.color);
                console.log('Ожидаемый primary:', 'rgb(98, 0, 238)'); // #6200ee
                console.log('Ожидаемый on-primary:', 'rgb(255, 255, 255)'); // #ffffff
                
                // Проверяем, разрешаются ли переменные
                const primaryVar = buttonStyle.getPropertyValue('--mdc-theme-primary');
                console.log('--mdc-theme-primary в кнопке:', primaryVar);
            }
            
            // Проверяем карточку
            const card = document.querySelector('.mdc-card');
            if (card) {
                const cardStyle = getComputedStyle(card);
                console.log('🔍 Карточка:');
                console.log('background-color:', cardStyle.backgroundColor);
                console.log('Ожидаемый surface:', 'rgb(255, 255, 255)'); // #ffffff
            }
        }
        
        // Запускаем отладку после загрузки
        window.addEventListener('load', () => {
            setTimeout(debugCSSVariables, 1000);
        });
        
        // Добавляем в глобальную область для вызова из консоли
        window.debugCSSVariables = debugCSSVariables;
    </script>
</body>
</html>
