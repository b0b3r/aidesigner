<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест замены с !important</title>
    
    <!-- Подключаем Material Design CSS -->
    <link href="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.css" rel="stylesheet">
    <link href="https://unpkg.com/@material/button@latest/dist/mdc.button.min.css" rel="stylesheet">
</head>
<body>
    <h1>🧪 Тест замены токенов с !important</h1>
    
    <div id="before-replacement">
        <h2>❌ ДО замены (с переменными)</h2>
        <button class="mdc-button mdc-button--filled" 
                style="background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary); padding: 12px 24px;">
            Кнопка с переменными
        </button>
    </div>
    
    <div id="after-replacement">
        <h2>✅ ПОСЛЕ замены (с !important)</h2>
        <button class="mdc-button mdc-button--filled" 
                style="background-color: #6200ee !important; color: #ffffff !important; padding: 12px 24px;">
            Кнопка с !important
        </button>
    </div>
    
    <div id="test-replacement">
        <h2>🧪 Тест функции замены</h2>
        <div id="replacement-result"></div>
    </div>
    
    <script>
        // Имитируем функцию замены из cssInjector
        function replaceTokensWithImportant(htmlContent) {
            const tokens = {
                '--mdc-theme-primary': '#6200ee',
                '--mdc-theme-on-primary': '#ffffff',
                '--mdc-theme-surface': '#ffffff',
                '--mdc-theme-background': '#f5f5f5',
                '--mdc-theme-text-primary-on-background': 'rgba(0, 0, 0, 0.87)',
                '--mdc-theme-text-secondary-on-background': 'rgba(0, 0, 0, 0.54)',
                '--mdc-theme-shadow': 'rgba(0, 0, 0, 0.2)'
            };
            
            let processedHTML = htmlContent;
            
            Object.entries(tokens).forEach(([variable, value]) => {
                const varPattern = new RegExp(`var\\(${variable.replace(/[-[\]{}()*+?.,\\^$|#\s]/g, '\\$&')}\\)`, 'g');
                // Заменяем на значение с !important
                processedHTML = processedHTML.replace(varPattern, `${value} !important`);
            });
            
            return processedHTML;
        }
        
        // Тестируем замену
        const originalHTML = `<button class="mdc-button mdc-button--filled" style="background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary);">Тест</button>`;
        const replacedHTML = replaceTokensWithImportant(originalHTML);
        
        console.log('🔍 ТЕСТ ЗАМЕНЫ С !IMPORTANT:');
        console.log('Оригинал:', originalHTML);
        console.log('После замены:', replacedHTML);
        console.log('Содержит !important:', replacedHTML.includes('!important'));
        
        // Добавляем результат на страницу
        document.getElementById('replacement-result').innerHTML = `
            <div style="background: #f0f0f0; padding: 16px; border-radius: 8px; font-family: monospace; font-size: 12px;">
                <strong>Оригинал:</strong><br>
                <code style="color: #d73a49;">${originalHTML}</code><br><br>
                <strong>После замены:</strong><br>
                <code style="color: #28a745;">${replacedHTML}</code>
            </div>
            <br>
            <div>Результат замены:</div>
            ${replacedHTML}
        `;
        
        // Проверяем стили всех кнопок
        function checkAllButtons() {
            const buttons = document.querySelectorAll('button');
            buttons.forEach((btn, index) => {
                const computedStyle = getComputedStyle(btn);
                console.log(`Кнопка ${index + 1}:`, {
                    backgroundColor: computedStyle.backgroundColor,
                    color: computedStyle.color,
                    isPurple: computedStyle.backgroundColor === 'rgb(98, 0, 238)'
                });
            });
        }
        
        window.addEventListener('load', () => {
            setTimeout(checkAllButtons, 1000);
        });
    </script>
</body>
</html>
