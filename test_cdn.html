<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест CDN источников</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .test-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }
        .status {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            margin-left: 10px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .test-item {
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест CDN источников Ant Design</h1>
    
    <div class="test-section">
        <div class="test-title">Тест 1: unpkg.com</div>
        <div class="test-item">
            <link href="https://unpkg.com/antd@5.0.0/dist/antd.min.css" rel="stylesheet">
            <button class="ant-btn ant-btn-primary">Ant Design Button (unpkg)</button>
            <span class="status" id="status1">⏳ Проверяется...</span>
        </div>
    </div>
    
    <div class="test-section">
        <div class="test-title">Тест 2: cdnjs.cloudflare.com</div>
        <div class="test-item">
            <link href="https://cdnjs.cloudflare.com/ajax/libs/antd/5.0.0/antd.min.css" rel="stylesheet">
            <button class="ant-btn ant-btn-primary">Ant Design Button (cdnjs)</button>
            <span class="status" id="status2">⏳ Проверяется...</span>
        </div>
    </div>
    
    <div class="test-section">
        <div class="test-title">Тест 3: jsdelivr.net</div>
        <div class="test-item">
            <link href="https://cdn.jsdelivr.net/npm/antd@5.0.0/dist/antd.min.css" rel="stylesheet">
            <button class="ant-btn ant-btn-primary">Ant Design Button (jsdelivr)</button>
            <span class="status" id="status3">⏳ Проверяется...</span>
        </div>
    </div>
    
    <div class="test-section">
        <div class="test-title">Тест 4: cdnjs.cloudflare.com (альтернативная версия)</div>
        <div class="test-item">
            <link href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.0/antd.min.css" rel="stylesheet">
            <button class="ant-btn ant-btn-primary">Ant Design Button (cdnjs v4)</button>
            <span class="status" id="status4">⏳ Проверяется...</span>
        </div>
    </div>
    
    <script>
        console.log('🧪 Тестирование CDN источников...');
        
        function checkCSSLoading(buttonSelector, statusId, cdnName) {
            setTimeout(() => {
                const button = document.querySelector(buttonSelector);
                const statusElement = document.getElementById(statusId);
                
                if (button) {
                    const computedStyle = window.getComputedStyle(button);
                    const hasStyles = computedStyle.backgroundColor !== 'rgba(0, 0, 0, 0)' || 
                                     computedStyle.borderRadius !== '0px' ||
                                     computedStyle.padding !== '0px';
                    
                    if (hasStyles) {
                        statusElement.textContent = '✅ Работает';
                        statusElement.className = 'status success';
                        console.log(`✅ ${cdnName}: CSS загружен успешно`);
                    } else {
                        statusElement.textContent = '❌ Не работает';
                        statusElement.className = 'status error';
                        console.log(`❌ ${cdnName}: CSS не загружен`);
                    }
                } else {
                    statusElement.textContent = '❌ Элемент не найден';
                    statusElement.className = 'status error';
                    console.log(`❌ ${cdnName}: Элемент не найден`);
                }
            }, 2000); // Даем время на загрузку CSS
        }
        
        // Проверяем каждый CDN
        checkCSSLoading('button:nth-of-type(1)', 'status1', 'unpkg.com');
        checkCSSLoading('button:nth-of-type(2)', 'status2', 'cdnjs.cloudflare.com');
        checkCSSLoading('button:nth-of-type(3)', 'status3', 'jsdelivr.net');
        checkCSSLoading('button:nth-of-type(4)', 'status4', 'cdnjs.cloudflare.com v4');
        
        console.log('✅ Тестирование CDN завершено');
    </script>
</body>
</html>
