    <script src="https://unpkg.com/material-components-web@latest/dist/material-components-web.min.js"></script>
    
    <!-- Дополнительные MDC JavaScript модули -->
    <script src="https://unpkg.com/@material/button@latest/dist/mdc.button.min.js"></script>
    <script src="https://unpkg.com/@material/card@latest/dist/mdc.card.min.js"></script>
    <script src="https://unpkg.com/@material/textfield@latest/dist/mdc.textfield.min.js"></script>

    <script src="https://unpkg.com/@material/chips@latest/dist/mdc.chips.min.js"></script>
    <script src="https://unpkg.com/@material/data-table@latest/dist/mdc.data-table.min.js"></script>
    <script src="https://unpkg.com/@material/top-app-bar@latest/dist/mdc.top-app-bar.min.js"></script>
    <script src="https://unpkg.com/@material/drawer@latest/dist/mdc.drawer.min.js"></script>

    <script src="https://unpkg.com/@material/menu@latest/dist/mdc.menu.min.js"></script>

    <script>
      // Инициализация ВСЕХ Material Design компонентов
      console.log('🎨 Инициализация Material Design компонентов...');
      
      // Автоматическая инициализация
      if (typeof mdc !== 'undefined') {
        mdc.autoInit();
        console.log('✅ Material Design компоненты инициализированы');
      } else {
        console.warn('⚠️ Material Design библиотека не загружена');
      }
      
      // Дополнительная инициализация для динамически созданных элементов
      window.initializeMDC = function() {
        if (typeof mdc !== 'undefined') {
          mdc.autoInit();
          console.log('🔄 Material Design компоненты переинициализированы');
        }
      };
    </script>
  </body>
