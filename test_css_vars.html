<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест CSS переменных в изолированном контексте</title>
    <style>
        /* Глобальные переменные */
        :root {
            --mdc-theme-primary: #6200ee;
            --mdc-theme-on-primary: #ffffff;
            --mdc-theme-secondary: #018786;
            --mdc-theme-surface: #ffffff;
            --mdc-theme-background: #f5f5f5;
            --mdc-theme-text-primary-on-background: rgba(0, 0, 0, 0.87);
        }
        
        body {
            background: var(--mdc-theme-background);
            font-family: 'Roboto', sans-serif;
            padding: 20px;
        }
        
        .test-container {
            background: white;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        
        .isolated-context {
            /* Имитируем изолированный контекст React Flow */
            position: relative;
            background: white;
            border: 2px solid #ddd;
            padding: 16px;
            margin: 16px 0;
            border-radius: 8px;
        }
        
        .with-internal-vars {
            /* Переменные определены внутри элемента */
            --mdc-theme-primary: #6200ee !important;
            --mdc-theme-on-primary: #ffffff !important;
            --mdc-theme-surface: #ffffff !important;
            --mdc-theme-text-primary-on-background: rgba(0, 0, 0, 0.87) !important;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест CSS переменных</h1>
    
    <div class="test-container">
        <h2>✅ Глобальные переменные (должны работать)</h2>
        <button style="background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary); padding: 12px 24px; border: none; border-radius: 4px;">
            Primary Button (глобальные переменные)
        </button>
    </div>
    
    <div class="test-container">
        <h2>❓ Изолированный контекст БЕЗ внутренних переменных</h2>
        <div class="isolated-context">
            <button style="background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary); padding: 12px 24px; border: none; border-radius: 4px;">
                Primary Button (наследование)
            </button>
        </div>
    </div>
    
    <div class="test-container">
        <h2>✅ Изолированный контекст С внутренними переменными</h2>
        <div class="isolated-context with-internal-vars">
            <button style="background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary); padding: 12px 24px; border: none; border-radius: 4px;">
                Primary Button (внутренние переменные)
            </button>
        </div>
    </div>
    
    <div class="test-container">
        <h2>🎯 Имитация React Flow узла</h2>
        <div style="position: relative; background: white; border: 2px solid #ddd; padding: 16px; border-radius: 8px;">
            <!-- Имитируем инжекцию токенов -->
            <style>
                * {
                    --mdc-theme-primary: #6200ee !important;
                    --mdc-theme-on-primary: #ffffff !important;
                    --mdc-theme-surface: #ffffff !important;
                    --mdc-theme-text-primary-on-background: rgba(0, 0, 0, 0.87) !important;
                }
            </style>
            <button style="background-color: var(--mdc-theme-primary); color: var(--mdc-theme-on-primary); padding: 12px 24px; border: none; border-radius: 4px;">
                Primary Button (как в артефакте)
            </button>
        </div>
    </div>
    
    <script>
        // Проверяем значения переменных
        function checkCSSVariables() {
            const elements = document.querySelectorAll('button');
            elements.forEach((btn, index) => {
                const computedStyle = getComputedStyle(btn);
                const bgColor = computedStyle.backgroundColor;
                const textColor = computedStyle.color;
                
                console.log(`Button ${index + 1}:`, {
                    backgroundColor: bgColor,
                    color: textColor,
                    isCorrectPrimary: bgColor === 'rgb(98, 0, 238)', // #6200ee
                    isCorrectText: textColor === 'rgb(255, 255, 255)' // #ffffff
                });
            });
        }
        
        // Запускаем проверку после загрузки
        window.addEventListener('load', () => {
            setTimeout(checkCSSVariables, 1000);
        });
    </script>
</body>
</html>
